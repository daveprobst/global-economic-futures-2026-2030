# Local run of the same image with the same limits the free host applies.
#   docker compose up --build      then open http://localhost:8080/
name: gef-explorer

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    image: gef-explorer:local
    platform: linux/amd64
    ports:
      - "8080:10000"
    environment:
      PORT: "10000"
      HOST: "0.0.0.0"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: "0.25"
    mem_limit: 128m
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,sys,urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/healthz' % os.environ.get('PORT','10000'), timeout=4); sys.exit(0)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
